[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "infra-agent"
version = "0.1.0"
description = "Read-only SRE agent over Prometheus, Loki, Grafana, OnCall and cloud inventories"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Swaroop Rangle", email = "swar.rang212@gmail.com"}]
keywords = ["sre", "devops", "langgraph", "prometheus", "loki", "grafana", "observability", "agent", "teams-bot"]
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.0",
    "langchain>=1.0",
    "langchain-core>=1.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6",
    "sqlalchemy>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "typer>=0.12",
    "rich>=13",
]

[project.urls]
Homepage = "https://github.com/swaroop002/infra-agent"
Documentation = "https://github.com/swaroop002/infra-agent/tree/main/docs"

[project.optional-dependencies]
anthropic = ["langchain-anthropic>=1.0"]
openai = ["langchain-openai>=1.0"]
google = ["langchain-google-genai>=2.0"]
bedrock = ["langchain-aws>=0.2"]
aws = ["boto3>=1.34"]
azure = ["azure-identity>=1.17", "azure-mgmt-compute>=33"]
gcp = ["google-cloud-compute>=1.19"]
teams = [
    "microsoft-agents-hosting-fastapi>=1.5",
    "microsoft-agents-authentication-msal>=1.5",
    "microsoft-agents-activity>=1.5",
]
sqlite-memory = ["langgraph-checkpoint-sqlite>=2.0"]
postgres = ["psycopg[binary]>=3.1", "langgraph-checkpoint-postgres>=2.0"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]
all = ["infra-agent[anthropic,openai,aws,azure,gcp,teams,sqlite-memory,dev]"]

[project.scripts]
infra-agent = "infra_agent.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
infra_agent = ["interfaces/web/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
